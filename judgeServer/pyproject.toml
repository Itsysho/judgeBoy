# -- Project metadata --
[project]
name = "judge-server"
version = "0.1.0"
requires-python = ">=3.12"

# -- Dependencies --
# "pip install ." will install these (like npm install reading package.json)
dependencies = [
    "django>=5.2,<6.0",
    "djangorestframework>=3.18,<4.0",
    "djangorestframework-simplejwt>=5.5,<6.0",
    "django-environ>=0.14,<1.0",
    "drf-spectacular>=0.30,<1.0",
]

# "pip install .[dev]" to install these too (like devDependencies)
[project.optional-dependencies]
dev = [
    "pytest>=9.0,<10.0",
    "pytest-django>=4.14,<5.0",
    "ruff",
]

# -- Tool settings --
# pytest: tell it where Django settings live
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"

# ruff: linter + formatter (like ESLint + Prettier)
[tool.ruff]
line-length = 120
